---
- name: Setup K3s Platform Node
  hosts: k3s_nodes
  become: true
  vars:
    k3s_version: "v1.31.4+k3s1"
    node_ip: "192.168.1.50"

  tasks:
    - name: Mise à jour du cache APT et installation des paquets prérequis
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600
        name:
          - curl
          - open-iscsi
          - nfs-common
          - ca-certificates
          - iptables
        state: present

    - name: Désactivation de la swap (exigence Kubernetes)
      ansible.builtin.command: swapoff -a
      changed_when: false

    - name: Chargement des modules noyau nécessaires
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Configuration sysctl pour Kubernetes
      ansible.posix.sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        state: present
        reload: yes
        sysctl_file: /etc/sysctl.d/99-kubernetes.conf
      loop:
        - { key: 'net.bridge.bridge-nf-call-iptables', value: '1' }
        - { key: 'net.bridge.bridge-nf-call-ip6tables', value: '1' }
        - { key: 'net.ipv4.ip_forward', value: '1' }

    - name: Création du dossier de configuration K3s
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: '0755'

    - name: Configuration déclarative de K3s (config.yaml)
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        mode: '0644'
        content: |
          write-kubeconfig-mode: "0644"
          tls-san:
            - "{{ node_ip }}"
          disable:
            - traefik
            - servicelb
          flannel-backend: "vxlan"

    - name: Vérifier si K3s est déjà installé
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_binary

    - name: Téléchargement et installation de K3s
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="{{ k3s_version }}" sh -
      when: not k3s_binary.stat.exists

    - name: Attente du démarrage de K3s
      ansible.builtin.systemd:
        name: k3s
        state: started
        enabled: yes

    - name: Attente que le nœud passe en état Ready
      ansible.builtin.command: kubectl get nodes
      register: nodes_output
      until: "' Ready ' in nodes_output.stdout"
      retries: 15
      delay: 5
      changed_when: false

    - name: Récupération du kubeconfig vers la machine locale
      ansible.builtin.fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "{{ playbook_dir }}/kubeconfig.yaml"
        flat: yes

    - name: Remplacement de localhost par l'IP de la VM dans le kubeconfig local
      delegate_to: localhost
      become: false
      ansible.builtin.replace:
        path: "{{ playbook_dir }}/kubeconfig.yaml"
        regexp: '127\.0\.0\.1'
        replace: "{{ node_ip }}"
